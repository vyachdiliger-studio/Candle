name: Task
description: A unit of work a contributor can pick up (maintainers create these)
labels: ["task"]
body:
  - type: textarea
    id: context
    attributes:
      label: Why
      description: What problem this solves for users or the project.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What to do
      description: The change, as concretely as possible.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Acceptance criteria — a reviewer checks exactly these.
      value: |
        - [ ] 
        - [ ] Tests added/updated
        - [ ] Docs in `docs/` updated if behaviour changed
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where to look
      description: Files, modules, related docs. Saves newcomers (and their AI agents) a lot of time.
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: ["S — a few hours", "M — 1–2 days", "L — several days"]
