name: Android release

# Every push to master that changes the app builds a signed bundle and sends it to
# Google Play (production track by default, see docs/deployment.md). Google still
# reviews each release before it reaches users.
on:
  push:
    branches: [master]
    paths:
      - "frontend/app/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Keep in sync with FLUTTER_VERSION in frontend/app/Dockerfile.
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

      - name: Upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # versionCode must grow with every upload; the offset keeps it above the
      # bundles uploaded by hand before this workflow existed.
      - name: Build bundle
        env:
          OFFSET: ${{ vars.ANDROID_VERSION_CODE_OFFSET }}
        run: |
          version_name=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          version_code=$(( ${OFFSET:-100} + GITHUB_RUN_NUMBER ))
          echo "Building $version_name ($version_code)"
          flutter build appbundle --release \
            --build-name="$version_name" --build-number="$version_code" \
            --dart-define=BUILD_COMMIT="$GITHUB_SHA"

      # Release builds fall back to the debug key without key.properties; Play would reject it.
      - name: Check the upload signature
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -q "Candle upload key"

      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.vyachdiliger.candle
          releaseFiles: frontend/app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ vars.PLAY_TRACK || 'production' }}
          status: completed
          whatsNewDirectory: frontend/app/store/google-play/whatsnew

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"
