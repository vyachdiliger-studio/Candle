<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta name="google-signin-client_id" content="663018526652-36cov1evmf91lj14ai4mckvrveb2h9k2.apps.googleusercontent.com">

  <meta charset="UTF-8">
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- candle:metadata:start -->
  <title>Candle</title>
  <meta name="description" content="Light a candle for health or for repose.">
  <!-- candle:metadata:end -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Candle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="manual_reload.js"></script>
  <script>
    (async () => {
    // Login SDK replaces the native event receiver; never load it in a Mini App.
    if (!window.Telegram?.WebApp?.initData) {
      await new Promise((resolve) => {
        const loginSdk = document.createElement('script');
        loginSdk.src = 'https://oauth.telegram.org/js/telegram-login.js?3';
        loginSdk.onload = resolve;
        loginSdk.onerror = resolve;
        document.head.appendChild(loginSdk);
      });
    }
    const bootstrap = document.createElement('script');
    const reloadId = new URL(location.href).searchParams.get('_reload');
    bootstrap.src = 'flutter_bootstrap.js' + (reloadId ? '?_reload=' + encodeURIComponent(reloadId) : '');
    document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
